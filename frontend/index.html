        <p>
          Вы выбираете действия обычным текстом. Рассказчик продолжает сцену, ведёт NPC, следит за
          состоянием персонажей и помнит, что произошло раньше. Объём этой памяти вы настраиваете

        </p>

          В Moru можно создать собственный мир: описать сеттинг, завести карточки персонажей, мест
          и правил, задать инструкции рассказчику и опубликовать готовый мир для других игроков.
          Библиотека сообщества открыта — можно начать с чужого мира и продолжить его по-своему.
        </p>

          Qwen, Claude и GPT. Они отличаются стилем повествования, глубиной проработки персонажей,
          объёмом памяти истории и стоимостью хода.
        </p>

          Свободный storytelling — текстовые истории без жёстких рамок. D&amp;D / RPG — AI-мастер,

          персонажи, эмоции и атмосферные фоны, где история раскрывается сцена за сценой.
        </p>
        <h2>Шесть ступеней памяти истории</h2>
        <p>
          Память Moru заточена под долгие игры. Каждый ход проходит шесть ступеней оптимизации:

        </p>
