x-backend-polza-env: &backend_polza_env
  # Cozy Village. В общем якоре, а не только у контейнера cozy: игра смонтирована ещё и в
  # gateway с монолитом (см. app/cozy/mount.py), а compose передаёт внутрь только то, что
  # перечислено у сервиса. Переменные у одного сервиса, а маршруты у другого - это ровно тот
  # случай, когда всё поднялось, health отвечает, а вход говорит "не настроен".
  COZY_GOOGLE_CLIENT_ID: "${COZY_GOOGLE_CLIENT_ID:-}"
  COZY_GOOGLE_CLIENT_SECRET: "${COZY_GOOGLE_CLIENT_SECRET:-}"
  COZY_GOOGLE_REDIRECT_URI: "${COZY_GOOGLE_REDIRECT_URI:-https://morius-ai.ru/api/cozy/auth/google/callback}"
  COZY_DATABASE_NAME: "${COZY_DATABASE_NAME:-cozyvillage}"
  COZY_YOOKASSA_SHOP_ID: "${COZY_YOOKASSA_SHOP_ID:-}"
  COZY_YOOKASSA_SECRET_KEY: "${COZY_YOOKASSA_SECRET_KEY:-}"
  COZY_YOOKASSA_RETURN_URL: "${COZY_YOOKASSA_RETURN_URL:-https://morius-ai.ru/api/cozy/payments/done}"
  COZY_YOOKASSA_WEBHOOK_TOKEN: "${COZY_YOOKASSA_WEBHOOK_TOKEN:-}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  YANDEX_CLIENT_ID: "${YANDEX_CLIENT_ID:-3f055a1e58f842b2a514685408003fd4}"
  YANDEX_REDIRECT_URI: "${YANDEX_REDIRECT_URI:-https://morius-ai.ru/api/auth/callback/yandex}"
  YANDEX_FRONTEND_URL: "${YANDEX_FRONTEND_URL:-https://morius-ai.ru}"
  VK_ID_CLIENT_ID: "${VK_ID_CLIENT_ID:-54643764}"
  VK_ID_REDIRECT_URI: "${VK_ID_REDIRECT_URI:-https://morius-ai.ru/api/auth/callback/vk}"
  VK_ID_FRONTEND_URL: "${VK_ID_FRONTEND_URL:-https://morius-ai.ru}"
  STORY_LLM_PROVIDER: "${STORY_LLM_PROVIDER:-routerai}"
  POLZA_API_KEY: "${POLZA_API_KEY:-}"
  POLZA_CHAT_URL: "${POLZA_CHAT_URL:-https://routerai.ru/api/v1/chat/completions}"
  POLZA_MODEL: "${POLZA_MODEL:-z-ai/glm-5}"
  POLZA_WORLD_CARD_MODEL: "${POLZA_WORLD_CARD_MODEL:-google/gemma-4-31b-it}"
  POLZA_TRANSLATION_MODEL: "${POLZA_TRANSLATION_MODEL:-google/gemma-4-31b-it}"
  POLZA_PLOT_CARD_MODEL: "${POLZA_PLOT_CARD_MODEL:-google/gemma-4-31b-it}"
  POLZA_SERVICE_FALLBACK_MODEL: "${POLZA_SERVICE_FALLBACK_MODEL:-nex-agi/nex-n2-pro}"
  POLZA_ACCELERATED_SERVICE_MODEL: "${POLZA_ACCELERATED_SERVICE_MODEL:-google/gemini-2.5-flash-lite}"
  POLZA_ACCELERATED_SERVICE_FALLBACK_MODEL: "${POLZA_ACCELERATED_SERVICE_FALLBACK_MODEL:-openai/gpt-oss-120b}"
  POLZA_IMAGE_URL: "${POLZA_IMAGE_URL:-https://routerai.ru/api/v1/images}"
  POLZA_IMAGE_MODEL: "${POLZA_IMAGE_MODEL:-google/gemini-2.5-flash-image}"
  POLZA_IMAGE_SIZE: "${POLZA_IMAGE_SIZE:-1024x1024}"
  POLZA_SITE_URL: "${POLZA_SITE_URL:-https://morius-ai.ru}"
  POLZA_APP_NAME: "${POLZA_APP_NAME:-MoRius}"
  PROXYAPI_KEY: "${PROXYAPI_KEY:-}"
  PROXYAPI_BASE_ROUTERAI: "${PROXYAPI_BASE_ROUTERAI:-https://routerai.ru/api/v1}"
  AITUNNEL_API_KEY: "${AITUNNEL_API_KEY:-}"
  AITUNNEL_BASE_URL: "${AITUNNEL_BASE_URL:-}"
  AITUNNEL_IMAGE_GENERATION_URL: "${AITUNNEL_IMAGE_GENERATION_URL:-}"
  AITUNNEL_IMAGE_EDIT_URL: "${AITUNNEL_IMAGE_EDIT_URL:-}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: morius
      POSTGRES_USER: morius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morius -d morius"]
      interval: 10s
      timeout: 5s
      retries: 8

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_polza_env
      APP_MODE: gateway
      PORT: 8000
      DB_BOOTSTRAP_ON_STARTUP: "true"
      DATABASE_URL: postgresql+psycopg://morius:${POSTGRES_PASSWORD:-change_me}@postgres:5432/morius
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      APP_TRUST_PROXY_HEADERS: "true"
      APP_FORWARDED_ALLOW_IPS: "*"
      APP_GZIP_ENABLED: "true"
      APP_GZIP_MINIMUM_SIZE: 1024
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_for_production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY_GATEWAY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_polza_env
      APP_MODE: auth
      PORT: 8001
      DB_BOOTSTRAP_ON_STARTUP: "false"
      DATABASE_URL: postgresql+psycopg://morius:${POSTGRES_PASSWORD:-change_me}@postgres:5432/morius
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      APP_TRUST_PROXY_HEADERS: "true"
      APP_FORWARDED_ALLOW_IPS: "*"
      APP_GZIP_ENABLED: "true"
      APP_GZIP_MINIMUM_SIZE: 1024
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_for_production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY_AUTH:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  story:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_polza_env
      APP_MODE: story
      PORT: 8002
      DB_BOOTSTRAP_ON_STARTUP: "false"
      DATABASE_URL: postgresql+psycopg://morius:${POSTGRES_PASSWORD:-change_me}@postgres:5432/morius
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      APP_TRUST_PROXY_HEADERS: "true"
      APP_FORWARDED_ALLOW_IPS: "*"
      APP_GZIP_ENABLED: "true"
      APP_GZIP_MINIMUM_SIZE: 1024
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_for_production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY_STORY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  payments:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_polza_env
      APP_MODE: payments
      PORT: 8003
      DB_BOOTSTRAP_ON_STARTUP: "false"
      DATABASE_URL: postgresql+psycopg://morius:${POSTGRES_PASSWORD:-change_me}@postgres:5432/morius
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      APP_TRUST_PROXY_HEADERS: "true"
      APP_FORWARDED_ALLOW_IPS: "*"
      APP_GZIP_ENABLED: "true"
      APP_GZIP_MINIMUM_SIZE: 1024
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_for_production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY_PAYMENTS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  # Cozy Village. Same image, its own mode, its own database on the same Postgres server -
  # COZY_DATABASE_NAME is a separate database, not a schema and not a prefix, so a game account
  # and a MoRius account cannot collide even by accident.
  cozy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_polza_env
      APP_MODE: cozy
      PORT: 8004
      DB_BOOTSTRAP_ON_STARTUP: "false"
      DATABASE_URL: postgresql+psycopg://morius:${POSTGRES_PASSWORD:-change_me}@postgres:5432/morius
      APP_TRUST_PROXY_HEADERS: "true"
      APP_FORWARDED_ALLOW_IPS: "*"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_for_production}
      # Letters go out through the same mailer MoRius uses; only the wording is the game's.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Rius Games}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Left empty on purpose: the settings fall back to GOOGLE_CLIENT_ID above, and a nested
      # default here would depend on which Compose version is on the box.
      COZY_GOOGLE_CLIENT_ID: "${COZY_GOOGLE_CLIENT_ID:-}"
      COZY_GOOGLE_CLIENT_SECRET: "${COZY_GOOGLE_CLIENT_SECRET:-}"
      COZY_GOOGLE_REDIRECT_URI: "${COZY_GOOGLE_REDIRECT_URI:-https://morius-ai.ru/api/cozy/auth/google/callback}"
      # Empty until the game's own ЮKassa shop exists; the shop screen reads /payments/status and
      # says so out loud rather than offering a button that does nothing.
      COZY_YOOKASSA_SHOP_ID: "${COZY_YOOKASSA_SHOP_ID:-}"
      COZY_YOOKASSA_SECRET_KEY: "${COZY_YOOKASSA_SECRET_KEY:-}"
      COZY_YOOKASSA_RETURN_URL: "${COZY_YOOKASSA_RETURN_URL:-https://morius-ai.ru/api/cozy/payments/done}"
      COZY_YOOKASSA_WEBHOOK_TOKEN: "${COZY_YOOKASSA_WEBHOOK_TOKEN:-}"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY_COZY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/api/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_AUTH_API_URL: ""
        VITE_STORY_API_URL: ""
        VITE_PAYMENTS_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      auth:
        condition: service_healthy
      story:
        condition: service_healthy
      payments:
        condition: service_healthy
      # Started, not healthy: nginx only needs the name to resolve when it comes up, and the site
      # must not wait on the game - or fail to start because of it.
      cozy:
        condition: service_started
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/vps/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
